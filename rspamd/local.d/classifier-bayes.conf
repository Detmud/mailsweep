# Bayes (#12): Daten in Redis, erreichbar nur über den Unix-Socket im gemeinsamen Volume.
# Kein TCP, kein DNS. Gelernt wird nur auf ausdrücklichen Wunsch aus mailsweep, nie automatisch.
backend = "redis";
servers = "/run/redis/redis.sock";
autolearn = false;
# Wirkt erst, wenn je Klasse so viele Mails angelernt sind (Rspamd-Standard)
min_learns = 200;
