# Komodo-Stack: /etc/komodo/stacks/mailsweep/compose.yaml
services:
  mailsweep:
    build: .
    image: mailsweep:local
    pull_policy: build          # lokales Image, nie aus einer Registry ziehen
    container_name: mailsweep
    restart: unless-stopped
    env_file: .env              # schreibt Komodo aus dem Stack-Feld "Environment"; ohne Komodo: cp mailsweep.env.example .env
    ports:
      - "8743:8080"
    networks:
      - default
      - spam                    # nur für den optionalen Rspamd
    volumes:
      - mailsweep-data:/data    # benanntes Volume: gehört automatisch dem Container-User
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined     # wie bei den anderen Stacks (PVE-Kernel + docker-default)
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Optionaler Spamfilter (#3). Startet nur mit COMPOSE_PROFILES=spam in der Env-Datei.
  rspamd:
    profiles: ["spam"]
    build: ./rspamd
    image: mailsweep-rspamd:local
    pull_policy: build
    container_name: mailsweep-rspamd
    restart: unless-stopped
    networks:
      - spam                    # kein Internet, kein Port nach außen
    environment:
      # Passwort für den Controller (Anlernen, #12). Leer = Controller aus, kein Anlernen.
      RSPAMD_CONTROLLER_PASSWORD: ${RSPAMD_PASSWORD:-}
    depends_on:
      - redis
    volumes:
      - rspamd-data:/var/lib/rspamd
      - redis-run:/run/redis    # Unix-Socket von Redis für die Bayes-Daten
    read_only: true
    tmpfs:
      - /run/rspamd:mode=1777
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Bayes-Daten für Rspamd (#12). Ohne Netz, nur Unix-Socket im Volume redis-run.
  redis:
    profiles: ["spam"]
    build: ./redis
    image: mailsweep-redis:local
    pull_policy: build
    container_name: mailsweep-redis
    restart: unless-stopped
    network_mode: none
    volumes:
      - redis-data:/var/lib/redis
      - redis-run:/run/redis
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  spam:
    internal: true              # Docker-Netz ohne Weg ins Internet

volumes:
  mailsweep-data:
  rspamd-data:
  redis-data:
  redis-run:
