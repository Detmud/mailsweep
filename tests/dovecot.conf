# Test-Dovecot für tests/ci.sh. @WORK@ ersetzt ci.sh durch sein Temp-Verzeichnis.
# Nur 127.0.0.1, ohne TLS, ein Benutzer test@icloud.test / geheim.
protocols = imap
listen = 127.0.0.1
base_dir = @WORK@/dc/run
state_dir = @WORK@/dc/state
log_path = @WORK@/dc/dovecot.log
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = @WORK@/dc/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=@WORK@/mail/%u
}
mail_location = maildir:~/Maildir
namespace inbox {
  inbox = yes
  separator = /
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
  mailbox "Deleted Messages" {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}
service imap-login {
  inet_listener imap {
    port = 10143
  }
}
